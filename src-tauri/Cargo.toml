[package]
name = "iomtal-launcher"
version = "0.1.0"
description = "IOMTAL SMP Launcher"
authors = ["IOMTAL"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "iomtal_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }


serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "charset",
    "http2",
] }

sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "5"
uuid = { version = "1", features = ["v4", "serde"] }
sysinfo = "0.32"
hickory-resolver = "0.25.2"
discord-rich-presence = "1.1"

[features]
# Tauri CLI bu feature'ı `tauri dev` sırasında kullanır.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
